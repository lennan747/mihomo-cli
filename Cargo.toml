[package]
name = "mihomo-cli"
version = "0.3.1"
edition = "2021"
authors = ["zhanglinan <lennan747@gmail.com>"]
license = "MIT"
description = "管理本机 mihomo (Clash Meta) 实例的命令行工具"
repository = "https://github.com/lennan747/mihomo-cli"
keywords = ["mihomo", "clash", "cli", "proxy", "command-line"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.80"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
terminal_size = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.30"
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
