[package]
name = "mihomo-cli"
version = "0.1.0"
edition = "2021"
authors = ["zhanglinan <lennan747@gmail.com>"]
license = "MIT"
description = "管理本机 mihomo (Clash Meta) 实例的命令行工具"
repository = "https://github.com/lennan747/mihomo-cli"
keywords = ["mihomo", "clash", "cli", "proxy", "command-line"]
categories = ["command-line-utilities"]
readme = "README.md"
rust-version = "1.80"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = "0.24"
